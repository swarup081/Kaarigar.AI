# Deploys the AI services as one public URL, which is what a standalone APK
# needs: an address that exists whether or not anyone's laptop is on.
#
# Render is chosen for the free tier that needs no card. Any container host
# works; the Dockerfile is not Render-specific.
#
# Setup:
#   1. New > Blueprint on render.com, point it at this repository
#   2. Set GEMINI_API_KEY in the dashboard, never in this file
#   3. Build the APK against the URL Render gives you
#
# Free instances sleep after inactivity and take roughly a minute to wake.
# Hit /health a few minutes before a demo, or use a paid instance on the day.

services:
  - type: web
    name: kaarigar-ai
    runtime: docker
    dockerfilePath: ./apps/ai-services/Dockerfile
    dockerContext: ./apps/ai-services
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      # sync: false means Render prompts for it and stores it as a secret.
      # The key must never live in this file: it is committed to the repo.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # Shared secret between the app and these services. Set it in the
      # dashboard too, and leave it unset to run open during early testing.
      - key: SHARED_API_KEY
        sync: false
